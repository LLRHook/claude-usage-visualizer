name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal --component rustfmt,clippy

      - name: Check and test Rust core
        run: |
          make check-rust
          make test-rust

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: make generate

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project macos/ClaudeUsageBar.xcodeproj \
            -scheme ClaudeUsageBar

      - name: Build
        run: make build XCODEBUILD_FLAGS=CODE_SIGNING_ALLOWED=NO

      - name: Swift unit and native parity tests
        run: make test

      - name: Synthetic pace benchmark with output parity
        run: make benchmark

  build:
    name: build
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every architecture check
        run: test "${{ needs.verify.result }}" = success
